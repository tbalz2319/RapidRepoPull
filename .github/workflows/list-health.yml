name: list health

# The curated list rots on its own schedule, not on the code's. Check it
# weekly so a dead or renamed repository is caught before someone's clone
# fails, rather than years later.

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays, 06:17 UTC
  workflow_dispatch:
    inputs:
      fix:
        description: "Apply the findings and open a pull request"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install .

      # GITHUB_TOKEN lifts the API limit from 60 calls an hour to 5000,
      # which matters because the list is larger than 60.
      - name: Check the bundled list
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rapidrepopull \
            -f rapidrepopull/data/default.txt \
            --doctor --verbose --no-banner | tee doctor-report.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: list-health-report
          path: doctor-report.txt

  fix:
    if: github.event_name == 'workflow_dispatch' && inputs.fix
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install .

      - name: Apply the findings to the list
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rapidrepopull \
            -f rapidrepopull/data/default.txt \
            --doctor --fix --no-banner || true

      - uses: peter-evans/create-pull-request@v7
        with:
          branch: list-health/auto
          title: "Repoint the repositories that have moved or gone"
          commit-message: |
            Repoint the repositories that have moved or gone

            Generated by 'rapidrepopull --doctor --fix'. Renamed repositories
            are repointed, deleted ones are commented out, and archived or
            long-dormant ones are annotated but left enabled.
          body: |
            `rapidrepopull --doctor --fix` found entries in the bundled list
            that no longer match reality.

            Renames are repointed and deletions are commented out. Archived and
            dormant repositories are only annotated -- they still clone, so
            whether to drop them is a curation decision, not an automatic one.

            Check the diff before merging: a redirect sometimes points at a
            legacy fork rather than the project's current home.
          labels: list-health
